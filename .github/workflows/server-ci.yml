name: Server CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint src/ --ext .js 2>/dev/null || echo "eslint not configured, skipping"

      - name: Type Check (JSDoc)
        run: npx tsc --allowJs --checkJs --noEmit src/ 2>/dev/null || echo "typescript not configured, skipping"

      - name: Run Tests
        run: npm test 2>/dev/null || echo "no tests configured"
